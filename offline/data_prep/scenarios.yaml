# Replay scenario days (solution2 §6.11). Each scenario is one service window
# on one day. The API replays these; the offline batch simulates them.
# Times are local (Asia/Kolkata).

window: {start: "15:30", end: "20:30"}   # replay window held in memory
clock_start: "16:30"                     # where "jump" puts the clock

scenarios:
  normal_weekday:
    label: Normal weekday
    date: "2026-09-23"
    rain_mm: 0.0
    temp_c: 31.0
    events: []
    breakdowns: []
  heavy_rain:
    label: Heavy rain
    date: "2026-09-24"
    rain_mm: 9.0
    temp_c: 26.0
    events: []
    breakdowns: []
  event_surge:
    label: Event surge at Guindy
    date: "2026-09-25"
    rain_mm: 0.0
    temp_c: 30.0
    # A large event near Guindy ends; heavy flow onto Route 3 toward T. Nagar and Thiruvanmiyur.
    events:
      - {stops: ["1465", "1048", "5766"], start: "17:15", end: "19:00", factor: 2.5}
    breakdowns: []
  breakdown:
    label: Bus breakdown on Route 3
    date: "2026-09-22"
    rain_mm: 0.0
    temp_c: 31.0
    events: []
    breakdowns:
      - {route_id: "3", at: "17:10"}
