# Demo route cluster (solution2 §13 Q1): 5 real Chennai MTC routes that share
# the T. Nagar – Saidapet – Guindy – Adyar corridor, and 2 depots.
#
# Stops, stop order and route numbers come from the community Chennai GTFS
# (gtfs_subset.py downloads it). Headways, busy factors, depots and stop types
# are not in the feed; they are set here from the feed's daily trip counts
# and local knowledge.

gtfs:
  url: https://raw.githubusercontent.com/ungalsoththu/ChennaiGTFS/main/data/chennai-unified-gtfs.zip
  source: "UngalSoththu, ChennaiGTFS (ODbL), feed version 2025.03.25"

timezone: Asia/Kolkata
capacity_rated: 60      # passengers at load factor 1.0
capacity_crush: 90      # hard limit; above this passengers are left behind
layover_min: 6          # terminal layover per trip end
deadhead_speed_kmh: 20

depots:
  - {id: depot_tnagar, name: T. Nagar Depot, lat: 13.0347, lon: 80.2300, fleet_size: 44, reserve: 4, out_of_service: 1}
  - {id: depot_adyar,  name: Adyar Depot,    lat: 13.0067, lon: 80.2532, fleet_size: 16, reserve: 2, out_of_service: 0}

# gtfs_route_id: one direction of the route in the feed (the other is its reverse).
# planned_headway_min: from GTFS trips per day; min_headway_min: longest headway allowed.
# busy_factor scales the calibrated daily total (1.0 = network average).
routes:
  - id: "3"
    gtfs_route_id: "24065"      # 185 trips/day
    name: "3 T. Nagar – Thiruvanmiyur"
    depot_id: depot_tnagar
    color: "#E4572E"
    planned_headway_min: 8
    min_headway_min: 12
    busy_factor: 1.5          # busiest route in the feed
  - id: "9M"
    gtfs_route_id: "23049"      # 55 trips/day
    name: "9M T. Nagar – AGS Colony"
    depot_id: depot_tnagar
    color: "#17BEBB"
    planned_headway_min: 15
    min_headway_min: 20
    busy_factor: 0.45
  - id: "5E"
    gtfs_route_id: "18958"      # 97 trips/day
    name: "5E Vadapalani – Besant Nagar"
    depot_id: depot_tnagar
    color: "#FFC914"
    planned_headway_min: 10
    min_headway_min: 15
    busy_factor: 1.0
  - id: "78"
    gtfs_route_id: "23937"      # 56 trips/day
    name: "78 Koyambedu – Thiruvanmiyur"
    depot_id: depot_adyar
    color: "#76B041"
    planned_headway_min: 15
    min_headway_min: 20
    busy_factor: 0.9
  - id: "S13"
    gtfs_route_id: "23065"      # 30 trips/day
    name: "S13 Velachery – Guindy"
    depot_id: depot_adyar
    color: "#8E6C8A"
    planned_headway_min: 20
    min_headway_min: 30
    busy_factor: 0.4

# Stop types drive the base boarding / alighting weight (demand_params.yaml).
# GTFS stop_id -> type; stops not listed get default_stop_type.
default_stop_type: minor
stop_types:
