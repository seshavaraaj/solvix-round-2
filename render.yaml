# Render Blueprint (contract §11). Person A owns this file; Person B supplies
# the static-site entries. Free tier only: one web service, one Postgres,
# static sites. Secrets are never in this file.
#
# Note: the API service does not set rootDir because it reads the committed
# artefacts in data/artefacts/, which are outside api/. buildFilter keeps
# auto-deploys limited to the backend paths.

services:
  - type: web
    name: aduthabus-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r api/requirements.txt
    # Seeding runs inside the API start-up thread (api/app/seed.py), so the port opens at once.
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - api/**
        - data/artefacts/**
        - scripts/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"          # numpy 2.5 needs Python >= 3.12
      - key: DATABASE_URL
        fromDatabase:
          name: aduthabus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPERATOR_PASSWORD
        sync: false              # set in the Render dashboard; never in Git
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://aduthabus-operator.onrender.com,https://aduthabus-admin.onrender.com,https://aduthabus-rider.onrender.com,http://localhost:5173,http://localhost:5174,http://localhost:8080
      - key: LIVE_MODE
        value: "false"
      - key: DEFAULT_SCENARIO
        value: event_surge
      - key: GTFS_RT_KEY
        sync: false              # only for optional live mode

  # ---- Person B: static sites (from .reports/implementation/03-frontend-handoff.md §1) ----
  - type: web
    name: aduthabus-operator
    runtime: static
    rootDir: operator
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://aduthabus-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: aduthabus-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://aduthabus-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: aduthabus-rider
    runtime: static
    rootDir: rider
    # Render static sites do not include Flutter, so the build clones the stable SDK.
    # $HOME persists between builds: reuse the SDK, and re-clone only if it is missing or broken.
    # Fallback (handoff §1): commit a local build to rider/web_dist/ and publish that instead.
    buildCommand: >-
      { [ -x $HOME/flutter/bin/flutter ] || { rm -rf $HOME/flutter &&
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter; }; } &&
      $HOME/flutter/bin/flutter config --enable-web &&
      $HOME/flutter/bin/flutter build web --release --dart-define=API_URL=$API_URL
    staticPublishPath: build/web
    envVars:
      - key: API_URL
        value: https://aduthabus-api.onrender.com

databases:
  - name: aduthabus-db
    plan: free
    region: singapore
    databaseName: aduthabus
    user: aduthabus
