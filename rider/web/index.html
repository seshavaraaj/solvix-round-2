<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; "/" by default. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live buses, arrival times and one-tap crowding reports.">
  <meta name="theme-color" content="#2a78d6">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AduthaBus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>AduthaBus Rider</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fcfcfb; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #52514e; }
    @media (prefers-color-scheme: dark) { html, body { background: #1a1a19; } #boot { color: #c3c2b7; } }
  </style>
</head>
<body>
  <div id="boot">Loading AduthaBus…</div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var el = document.getElementById("boot");
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
